<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerta Hogar - Mi Perfil</title> 
    <link rel="icon" href="../Img/Logo.jpg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="carousel.css" rel="stylesheet"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" ...>
    <link href="carousel.css" rel="stylesheet"> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ...></script>

    <link rel="stylesheet" href="../css/perfilCliente.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../css/perfilCliente.css">
    </head>
<body>
    


    <div class="container-fluid">
        <div class="row">
            <main class="col-12 px-md-4">
                <div class="text-center mb-4">
                    <h5>Bienvenido, <br><strong>[Nombre Vendedor]</strong></h5>
                </div>
                
                <div class="d-flex justify-content-end align-items-center p-3 pb-0">
                    <a href="../../index.html" class="btn btn-outline-danger btn-sm">Cerrar sesión</a>
                </div>

                <div class="pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Resumen del Perfil</h1>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Editar mi nombre</h5>
                        <form id="update-profile-form">
                            <div class="mb-3">
                                <label for="nombreUsuario" class="form-label">Nombre de usuario</label>
                                <input type="text" class="form-control" id="nombreUsuario" placeholder="Nuevo nombre">
                            </div>
                            <button type="submit" class="btn btn-primary">Actualizar nombre</button>
                        </form>
                        <div id="update-message" class="mt-3"></div>
                    </div>
                </div>

                <p>Aquí puedes ver un resumen de tu actividad reciente.</p>

                <!-- Nav tabs -->
                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="productos-tab" data-bs-toggle="tab" data-bs-target="#productos" type="button" role="tab" aria-controls="productos" aria-selected="true">Mis Productos</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="ventas-tab" data-bs-toggle="tab" data-bs-target="#ventas" type="button" role="tab" aria-controls="ventas" aria-selected="false">Mis Ventas</button>
                    </li>
                </ul>

                <!-- Tab panes -->
                <div class="tab-content" id="myTabContent">
                    <div class="tab-pane fade show active" id="productos" role="tabpanel" aria-labelledby="productos-tab">
                        <div class="table-responsive mt-3">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th scope="col">Nombre</th>
                                        <th scope="col">Precio</th>
                                        <th scope="col">Stock</th>
                                        <th scope="col">Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="productos-tbody">
                                    <!-- Los productos se cargarán aquí -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="ventas" role="tabpanel" aria-labelledby="ventas-tab">
                        <div class="table-responsive mt-3">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th scope="col"># Pedido</th>
                                        <th scope="col">Fecha</th>
                                        <th scope="col">Productos</th>
                                        <th scope="col">Total</th>
                                        <th scope="col">Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="ventas-tbody">
                                    <!-- Las ventas se cargarán aquí -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="../js/perfilVendedor-api.js"></script>
    </body>
</html>
