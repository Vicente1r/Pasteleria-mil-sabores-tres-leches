  <main>

  <!-- Firebase y registro desde CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1_om-_HPyYVnUo8ELiM5Zob2VSMGbWvw",
      authDomain: "pasteleriamilsaborestresleches.firebaseapp.com",
      projectId: "pasteleriamilsaborestresleches",
      storageBucket: "pasteleriamilsaborestresleches.firebasestorage.app",
      messagingSenderId: "724534518591",
      appId: "1:724534518591:web:fda9e47afb93ed6854e98a",
      measurementId: "G-FXQWCCHM83",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const formRegister = document.getElementById("form-register");

    if (formRegister) {
      formRegister.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btnRegister = document.getElementById("btn-register");
        if (!btnRegister) return;
        btnRegister.disabled = true;
        btnRegister.textContent = "Registrando...";

        try {
          const correo = document.getElementById("correo_reg")?.value.trim();
          const password = document.getElementById("password")?.value;

          if (!correo || !password) {
            alert("Por favor, completa correo y contraseña");
            btnRegister.disabled = false;
            btnRegister.textContent = "Registrar";
            return;
          }

          const userCredential = await createUserWithEmailAndPassword(auth, correo, password);
          const user = userCredential.user;

          const runInput = document.getElementById("reg-run");
          const nombreInput = document.getElementById("nombre");
          const correo2Input = document.getElementById("correo2");
          const telefonoInput = document.getElementById("telefono");
          const comunaInput = document.getElementById("comuna");
          const fechaInput = document.getElementById("reg-fecha");

          const run = runInput ? parseInt(runInput.value.trim()) : null;
          const nombre = nombreInput ? nombreInput.value.trim() : "";
          const correo2 = correo2Input ? correo2Input.value.trim() : "";
          const telefono = telefonoInput ? parseInt(telefonoInput.value.trim()) : null;
          const comuna = comunaInput ? comunaInput.value : "";
          const fechaNacimiento = fechaInput && fechaInput.value ? new Date(fechaInput.value) : null;

          // Construimos el objeto userData con los datos formateados según lo solicitado
          const userData = {
            run: run,
            nombre_completo: nombre,
            correo: correo,
            contraseña: password,
            telefono: telefono,
            fecha_nacimiento: fechaNacimiento ? fechaNacimiento.toISOString() : null,
            comuna: comuna,
            createdAt: new Date().toISOString(),
          };

          await setDoc(doc(db, "usuario", user.uid), userData);

          alert("¡Registro exitoso! Usuario creado y guardado en Firestore.");
        } catch (error) {
          console.error("Error en registro:", error);
          alert("Error al registrar usuario: " + (error.message || error.code));
        } finally {
          btnRegister.disabled = false;
          btnRegister.textContent = "Registrar";
        }
      });
    }

  </script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('form-registro');
  form.addEventListener('submit', function(e) {
    const fechaNacimiento = document.getElementById('fecha_nacimiento').value;
    if (!fechaNacimiento) {
      alert('Por favor, ingrese su fecha de nacimiento.');
      e.preventDefault();
      return;
    }
    const hoy = new Date();
    const nacimiento = new Date(fechaNacimiento);
    let edad = hoy.getFullYear() - nacimiento.getFullYear();
    const m = hoy.getMonth() - nacimiento.getMonth();
    if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) {
      edad--;
    }
    if (edad > 50) {
      alert('¡Felicidades! Por tener más de 50 años, tienes un 50% de descuento.');

    }

  });
});
</script>
