<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras - Pastelería Mil Sabores Tres Leches</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/carrito.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
  <!-- HEADER -->
  <header class="topbar">
    <div class="logo">
      <img src="../Logo.png" alt="Logo Pastelería Mil Sabores">
    </div>

    <div class="header-title">
      <strong>🍰 Pastelería Mil Sabores</strong>
    </div>

    <nav class="navegacion" aria-label="Navegación principal">
      <a href="/index.html">Home</a>
      <a href="/assets/page/catalogo.html">Catálogo</a>
      <a href="/assets/page/nosotros.html">Nosotros</a>
      <a href="/assets/page/blog.html">Blog</a>
      <a href="/assets/page/contacto.html">Contacto</a>
      <a href="/assets/page/ofertas.html">Ofertas</a>
    </nav>

    <div class="usuario">
      <a id="inicio_sesion" href="login.html">Iniciar sesión</a>
      <span class="separar">|</span>
      <a id="registrarse" href="registrarse.html">Registrarse</a>
      <span class="separar">|</span>
      <a href="carrito.html">🛒 Carrito (0)</a>
    </div>
  </header>

  <main class="main">
    <section class="carrito-container" aria-labelledby="titulo-carrito">
      <h1 id="titulo-carrito" class="carrito-titulo">Tu Carrito de Compras</h1>

      <!-- Carrito vacío -->
      <div id="carrito-vacio" class="carrito-vacio" style="display: none;">
        <div class="carrito-vacio-icon">🛒</div>
        <h2>Tu carrito está vacío</h2>
        <p>¡Agrega algunos productos deliciosos de nuestra pastelería!</p>
        <a href="catalogo.html" class="btn-ir-catalogo">Ver Catálogo</a>
      </div>

      <!-- Lista de productos en el carrito -->
      <div id="carrito-items" class="carrito-items">
        <!-- Los items del carrito se cargarán dinámicamente aquí -->
      </div>

      <!-- Resumen del carrito -->
      <div id="carrito-resumen" class="carrito-resumen" style="display: none;">
        <div class="resumen-total">
          <div class="total-line">
            <span class="total-label">Subtotal:</span>
            <span id="subtotal" class="total-amount">$0 CLP</span>
          </div>
          <div class="total-line total-final">
            <span class="total-label">Total:</span>
            <span id="total" class="total-amount">$0 CLP</span>
          </div>
        </div>
        <div class="resumen-acciones">
          <button id="btn-seguir-comprando" class="btn-seguir-comprando">Seguir Comprando</button>
          <button id="btn-proceder-pago" class="btn-proceder-pago">Proceder al Pago</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Notificaciones -->
  <div id="notificaciones" class="notificaciones"></div>

  <script src="../js/carrito.js"></script>
  <script type="module" src="../../js/auth.js"></script>
</body>
</html>
