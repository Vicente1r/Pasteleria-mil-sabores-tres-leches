<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras - Mi Tienda</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/catalogo.css">
  <link rel="stylesheet" href="../css/carrito.css">

  <!-- Removed Firebase 8 scripts to avoid conflicts -->

  <script src="../js/carrito.js"></script>
  <script src="../js/inicio_sesion.js" defer></script>
</head>
<body>
  <!-- HEADER -->
  <header class="topbar">
    <div class="logo">
      <img src="../assets/Logo.png" alt="">
    </div>

    <div>
      <strong>Tienda online - Mil Sabores</strong>
    </div>

    <nav class="navegacion" aria-label="Navegación principal">
      <a href="../../index.html">Home</a>
      <a href="catalogo.html">Productos</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="blog.html">Blog</a>
      <a href="contacto.html">Contacto</a>
      <a href="ofertas.html">Ofertas</a>
    </nav>

    <div class="usuario">
      <a id="inicio_sesion" href="login.html">Iniciar sesión</a>
      <span class="separar">|</span>
      <a id="registrarse" href="registrarse.html">Registrarse</a>
      <span class="separar">|</span>
      <a href="carrito.html" id="carrito-link">Carrito (0)</a>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div class="carrito-container">
      <!-- Lista de Productos con Ofertas -->
      <section class="ofertas-section">
        <h2 class="section-title">Productos en Oferta</h2>
        <div id="productosOferta" class="productos-grid"></div>
      </section>

      <!-- Resumen del Carrito -->
      <section class="resumen-carrito">
        <h2 class="section-title">Resumen del Carrito</h2>
        
        <!-- Tabla de productos en carrito -->
        <div class="tabla-carrito-container">
          <table class="tabla-carrito">
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaCarritoBody">
              <!-- Los productos del carrito se insertarán aquí -->
            </tbody>
          </table>
        </div>

        <!-- Total y Botones -->
        <div class="carrito-footer">
          <div class="total-container">
            <span class="total-text">Total: $</span>
            <span id="totalCarrito" class="total-precio">0</span>
          </div>
          <div class="botones-carrito">
            <button id="btnLimpiarCarrito" class="btn-limpiar">Limpiar Carrito</button>
            <button id="btnComprarAhora" class="btn-comprar-ahora">Comprar Ahora</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="../../js/auth.js"></script>
</body>
</html>
