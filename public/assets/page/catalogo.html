  <script>
    // mapa entre botónes visuales y select (mantener compatibilidad con catalogo.js)
    (function(){
      const thumbs = document.querySelectorAll('.category-thumb');
      const filtro = document.getElementById('filtro');
      const titulo = document.getElementById('titulo-productos');

      const labelMap = {
        tortas_chocolate: 'Categoría 1',
        tortas_circulares: 'Categoría 2',
        tortas_cuadradas: 'Categoría 3',
        postres_individuales: 'Categoría 4'
      };

      function setActiveFilter(value){
        // actualizar select (dispara handlers ya presentes en catalogo.js si existen)
        if(filtro){
          filtro.value = value;
          filtro.dispatchEvent(new Event('change', { bubbles: true }));
        }
        // actualizar estado visual
        thumbs.forEach(t => {
          const active = t.dataset.filter === value;
          t.classList.toggle('active', active);
          t.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        if(titulo) titulo.textContent = labelMap[value] || 'Categorías';
        // scroll suave hasta la sección correspondiente y resaltar
        const section = document.getElementById('section-' + value);
        // remover highlight de otras secciones
        document.querySelectorAll('.category-section-title').forEach(h => h.classList.remove('active'));
        if(section) {
          const heading = document.getElementById('section-' + value);
          if(heading) heading.classList.add('active');
          section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          // fallback: scroll al título grande
          if(titulo) window.scrollTo({ top: titulo.getBoundingClientRect().top + window.scrollY - 20, behavior: 'smooth' });
        }
      }

      thumbs.forEach(b => b.addEventListener('click', () => setActiveFilter(b.dataset.filter)));

      // inicio con tortas de chocolate (igual que la captura)
      setActiveFilter('tortas_chocolate');
    })();
  </script>
