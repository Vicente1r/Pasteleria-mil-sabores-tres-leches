<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="company-logo">
                <div class="logo-container">
                    <div class="logo-icon"></div>
                    <span class="company-name">Company</span>
                </div>
            </div>
            
            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <div class="nav-icon dashboard-icon"></div>
                    Dashboard
                </a>
                <a href="#" class="nav-item">
                    <div class="nav-icon orders-icon"></div>
                    Orders
                </a>
                <a href="#" class="nav-item">
                    <div class="nav-icon inventory-icon"></div>
                    Inventory
                </a>
                <a href="#" class="nav-item">
                    <div class="nav-icon reports-icon"></div>
                    Reports
                </a>
                <a href="#" class="nav-item">
                    <div class="nav-icon employees-icon"></div>
                    Employees
                </a>
                <a href="#" class="nav-item">
                    <div class="nav-icon customers-icon"></div>
                    Customers
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="#" class="nav-item">
                    <div class="nav-icon settings-icon"></div>
                    Settings
                </a>
                <a href="#" class="nav-item">
                    <div class="nav-icon profile-icon"></div>
                    Profile
                </a>
                <a href="#" class="nav-item">
                    <div class="nav-icon search-icon"></div>
                    Search
                </a>
                <a href="#" class="nav-item">
                    <div class="nav-icon help-icon"></div>
                    Help
                </a>
                
                <div class="user-profile">
                    <div class="user-avatar">P</div>
                    <div class="user-info">
                        <div class="user-name">Profile</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <header class="top-header">
                <h1 class="welcome-text">¡HOLA Administrador!</h1>
                <div class="header-actions">
                    <div class="notification-bell">
                        <div class="bell-icon"></div>
                        <div class="notification-badge">3</div>
                    </div>
                </div>
            </header>
            
            <main class="content-area">
                <!-- Aquí va el contenido principal del dashboard -->
            </main>
        </div>
    </div>
</body>
</html>
