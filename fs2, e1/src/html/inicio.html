<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/fs2, e1/src/js/inicio_sesion.js"></script>
  <title>Pastelería Mil Sabores</title>

</head>
<body>
  <!-- Formulario de inicio de sesión -->
  <main>


      <dialog id="modal">
        <section>
          <h2>Inicio de sesión</h2>
          <form method="dialog">
            <div>
              <label for="email">Correo: </label>
              <input type="email" name="email" id="email" required placeholder="Ingresa Tu Correo">
            </div>
            <div>
              <label for="password">Contraseña: </label>
              <input type="password" name="password" id="password" required placeholder="Ingresa Tu Contraseña" >
            </div>
            <div>
              <button type="submit">Iniciar Sesión</button>
            </div>
            <button id="cerrar" type="button">cerrar</button>
          </form>
        </section>

      </dialog>





  </main>
</body>
</html>
